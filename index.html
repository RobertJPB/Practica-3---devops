<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola Mundo | Práctica 3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0f141c;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 540px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 2.5rem;
    }

    .header {
      border-bottom: 1px solid #21262d;
      padding-bottom: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #7ee787;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      color: #f0f6fc;
      line-height: 1.25;
    }

    p {
      font-size: 0.95rem;
      color: #8b949e;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .details {
      background-color: #0d1117;
      border: 1px solid #21262d;
      border-radius: 4px;
      padding: 1rem 1.25rem;
      font-size: 0.85rem;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 0.35rem 0;
      border-bottom: 1px solid #161b22;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      color: #8b949e;
    }

    .value {
      color: #58a6ff;
    }

    .value.ok {
      color: #3fb950;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="header">
      <span class="tag">Despliegue activo</span>
      <h1>Hola Mundo</h1>
    </div>

    <p>
      Página web automatizada para la Práctica 3 de DevOps con integración y despliegue continuo en la nube.
    </p>

    <div class="details">
      <div class="row">
        <span class="label">Servicio</span>
        <span class="value">GitHub Pages</span>
      </div>
      <div class="row">
        <span class="label">Repositorio</span>
        <span class="value">RobertJPB / Practica-3---devops</span>
      </div>
      <div class="row">
        <span class="label">Estado</span>
        <span class="value ok">Online (200 OK)</span>
      </div>
    </div>
  </main>
</body>
</html>
